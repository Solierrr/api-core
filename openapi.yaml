openapi: 3.1.0
info:
  contact:
    name: Solaria
    url: https://github.com/Solierrr
  description: "Cadastro central da plataforma: empresas, profissionais, fornecedores,\
    \ produtos ofertados, propostas, projetos, pedidos e unidades consumidoras com\
    \ as suas faturas de energia, cada pessoa vendo e alterando só o que o papel dela\
    \ na empresa permite. As rotas usam o JWT emitido pelo api-auth (bearerAuth);\
    \ o catálogo público não exige autenticação, e as rotas internas usam a chave\
    \ de serviço do chamador no cabeçalho X-Service-Key (serviceKey)."
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  title: Solaria — api-core
  version: 3.0.1 # x-release-please-version
servers:
- description: QA
  url: https://api-core-cqfn.onrender.com
- description: Local
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: Gerenciamento de pessoas físicas cadastradas no sistema
  name: Pessoas
- description: Gerenciamento das avaliações realizadas sobre profissionais
  name: Avaliações de Profissionais
- description: Feeds de recomendação do api-recommendation para o usuário autenticado;
    a chave do serviço nunca chega ao navegador.
  name: Recommendation Feeds
- description: Gerenciamento de endereços cadastrados no sistema
  name: Endereços
- description: Gerenciamento dos solicitantes vinculados às empresas
  name: Solicitantes
- description: "Gerenciamento do vínculo entre usuários e empresas, incluindo o cargo\
    \ (position) associado."
  name: Vínculos de Usuários
- description: Gerenciamento das profissões cadastradas
  name: Profissões
- description: "Leituras do catálogo para o mcp-database, autenticadas pelo header\
    \ X-Service-Key com a chave SERVICE_KEY_MCP_DATABASE"
  name: Catálogo interno
- description: Gerenciamento dos usuários do sistema
  name: Usuários
- description: Gerenciamento dos serviços técnicos e do seu ciclo de vida
  name: Serviços Técnicos
- description: Registro da última ação de cada usuário no sistema
  name: Log de Atividade
- description: Gerenciamento das coordenadas geográficas vinculadas a endereços.
  name: Geolocalizações
- description: Gerenciamento das afiliações de técnicos a entidades profissionais
  name: Afiliações de Técnicos
- description: Gerenciamento de assinaturas de planos/serviços contratados pelas empresas
  name: Assinaturas
- description: Gerenciamento dos projetos técnicos das empresas
  name: Projetos Técnicos
- description: Gerenciamento das ofertas comerciais disponibilizadas pelos fornecedores.
  name: Ofertas
- description: "Gerenciamento dos registros/matrículas profissionais dos técnicos\
    \ (ex. CREA, CFT)"
  name: Registros Profissionais
- description: Gerenciamento dos registros de certificação vinculados a profissionais
  name: Registros de Certificação
- description: Gerenciamento das unidades locais (unidades operacionais) das empresas
  name: Unidades Locais
- description: "Gerenciamento das fotos (perfil/banner) de um usuário, armazenadas\
    \ no Cloudinary."
  name: Fotos de Usuários
- description: Gerenciamento dos executores responsáveis pela prestação de serviços
  name: Executores de Serviço
- description: Gerenciamento das unidades/itens que compõem uma proposta comercial
  name: Unidades de Proposta
- description: Envio e revisão dos documentos que liberam o profissional para os clientes
  name: Cadastro Profissional
- description: Registro e consulta de contas de energia
  name: Contas de Energia
- description: Estoque privado da empresa do fornecedor; listas validam o parent mesmo
    vazias
  name: Estoque
- description: Gerenciamento das permissões do sistema
  name: Permissões
- description: Gerenciamento das conexões unilaterais do usuário autenticado
  name: Conexões
- description: Gerenciamento do cadastro de técnicos responsáveis pela execução de
    serviços.
  name: Técnicos
- description: Projetos privados empresariais e profissionais; acesso por propriedade
    e participação
  name: Projetos
- description: Equipes de profissionais montadas pelas empresas
  name: Equipes Profissionais
- description: Gerenciamento dos cargos disponíveis na plataforma
  name: Cargos
- description: Pedidos das empresas para cadastrar marcas novas e a revisão desses
    pedidos
  name: Solicitações de Marcas
- description: Perfil do usuário autenticado para o app do profissional
  name: Perfil pessoal
- description: "Gerenciamento dos contratos de prestação de serviço, imutáveis apó\
    s criação."
  name: Contratos de Serviço
- description: Gerenciamento dos contatos comerciais das empresas
  name: Contatos Comerciais
- description: "Gerenciamento das fotos de um modelo de placa solar, armazenadas no\
    \ Cloudinary."
  name: Fotos de Modelos
- description: Gerenciamento dos planos de assinatura vinculados às empresas.
  name: Planos de Empresas
- description: Pessoas com administração da plataforma inteira
  name: Administradores da Plataforma
- description: Endpoint M2M usado pelo api-auth
  name: Provisionamento Interno de Usuários
- description: "Carrinho de compras do usuário autenticado, guardado no servidor"
  name: Carrinho
- description: Assinatura atual da empresa fornecedora e suas cobranças
  name: Plano da empresa
- description: Gerenciamento de modelos de equipamentos
  name: Modelos
- description: Catálogo público e privado de marcas; escrita sujeita ao RBAC existente
    e à autoria empresarial
  name: Marcas
- description: Gerenciamento dos cursos técnicos cadastrados
  name: Cursos Técnicos
- description: "Gerenciamento de cobranças financeiras e seu ciclo de vida (pagamento,\
    \ cancelamento, estorno)"
  name: Cobranças
- description: Gerenciamento dos itens de uma proposta comercial
  name: Itens de Proposta
- description: "Vitrine pública de empresas, ofertas e técnicos; não exige autenticaç\
    ão"
  name: Catálogo Público
- description: Gerenciamento do cadastro de certificações técnicas/profissionais.
  name: Certificações
- description: Endpoint M2M usado pelo api-messenger
  name: Acesso Interno a Projetos Técnicos
- description: Situação das ofertas e o histórico das mudanças
  name: Ciclo de Vida de Ofertas
- description: Gerenciamento das permissões concedidas a cargos (positions).
  name: Permissões de Cargos
- description: Vendas da empresa fornecedora
  name: Vendas
- description: "Gerenciamento das fotos (perfil/banner) de uma empresa, armazenadas\
    \ no Cloudinary."
  name: Fotos de Empresas
- description: "Gerenciamento do ciclo de vida das propostas comerciais, incluindo\
    \ o handshake de negociação entre fornecedor e solicitante."
  name: Propostas
- description: Endpoint M2M usado pelo api-messenger
  name: Acesso Interno a Projetos
- description: Códigos que convidam pessoas a entrar em uma empresa
  name: Códigos de Acesso
- description: Atalho de login para testar pelo Swagger; sai quando o login pelo web-sandbox
    estiver no ar
  name: Dev
- description: Gerenciamento das especificações técnicas de unidades locais (histórico
    imutável)
  name: Especificações de Unidade
- description: Gerenciamento dos fornecedores e do seu ciclo de vida por status
  name: Fornecedores
- description: Gerenciamento das empresas cadastradas na plataforma
  name: Empresas
- description: "Gerenciamento das fotos de uma unidade local, armazenadas no Cloudinary."
  name: Fotos de Unidades Locais
- description: Gerenciamento dos turnos de trabalho dos técnicos
  name: Turnos
- description: Compra de unidades de ofertas com pagamento fictício
  name: Pedidos
paths:
  /api/access-codes:
    post:
      operationId: generateAccessCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessCodeRequestDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Gera um código de acesso para a empresa
      tags:
      - Códigos de Acesso
  /api/access-codes/company/{companyId}:
    get:
      operationId: findByCompanyAccessCode
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessCodeResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Lista os códigos de acesso da empresa
      tags:
      - Códigos de Acesso
  /api/access-codes/redeem:
    post:
      operationId: redeemAccessCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemAccessCodeRequestDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCompanyResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Resgata um código e vincula o usuário à empresa
      tags:
      - Códigos de Acesso
  /api/access-codes/{id}/company/{companyId}:
    delete:
      operationId: revokeAccessCode
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Revoga um código de acesso da empresa
      tags:
      - Códigos de Acesso
  /api/addresses:
    get:
      operationId: findAllAddress
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResponseDTO"
          description: Lista de endereços retornada com sucesso
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Lista todos os endereços cadastrados
      tags:
      - Endereços
    post:
      description: CEP é obrigatório e deve ter 8 dígitos numéricos (validado no DTO
        e reforçado por trigger); estado deve ter 2 caracteres.
      operationId: saveAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequestDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponseDTO"
          description: Endereço criado com sucesso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Dados de entrada inválidos
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Cria um novo endereço
      tags:
      - Endereços
  /api/addresses/{id}:
    delete:
      description: "Não é possível excluir um endereço referenciado por Company, LocalUnit\
        \ ou Geolocation."
      operationId: deleteByIdAddress
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Endereço excluído com sucesso
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Endereço não encontrado
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Exclui um endereço pelo identificador
      tags:
      - Endereços
    get:
      operationId: findByIdAddress
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponseDTO"
          description: Endereço encontrado
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Endereço não encontrado
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Busca um endereço pelo identificador
      tags:
      - Endereços
    put:
      description: CEP é obrigatório e deve ter 8 dígitos numéricos (validado no DTO
        e reforçado por trigger); estado deve ter 2 caracteres.
      operationId: updateAddress
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequestDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponseDTO"
          description: Endereço atualizado com sucesso
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Dados de entrada inválidos
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Endereço não encontrado
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Atualiza um endereço existente
      tags:
      - Endereços
  /api/brand-requests:
    get:
      operationId: ownBrandRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandRequestResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Lista somente solicitações da empresa autenticada
      tags:
      - Solicitações de Marcas
  /api/brand-requests/{id}/cancel:
    post:
      description: Exige revisão atual e desbloqueia edição
      operationId: cancelBrandRequest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandDecisionDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRequestResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Cancela solicitação pendente da empresa
      tags:
      - Solicitações de Marcas
  /api/brand-review:
    get:
      description: Exclusivo do Admin Solaria
      operationId: reviewBrandRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandRequestResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Lista solicitações para análise
      tags:
      - Solicitações de Marcas
  /api/brand-review/{id}/decision:
    post:
      description: Exclusivo do Admin Solaria; motivo obrigatório na reprovação; revisão
        divergente não é aceita
      operationId: decideBrandRequest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: approved
        required: true
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandDecisionDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRequestResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Aprova ou reprova solicitação
      tags:
      - Solicitações de Marcas
  /api/brands:
    get:
      operationId: listBrand
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Lista marcas públicas e marcas da empresa autenticada
      tags:
      - Marcas
    post:
      description: Publicação exige solicitação e aprovação humana do Admin Solaria
      operationId: createBrand
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequestDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResponseDTO"
          description: Created
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Cria marca privada
      tags:
      - Marcas
  /api/brands/logo:
    post:
      description: "JPEG, PNG ou WebP, até 8 MB"
      operationId: logoBrand
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Envia logo opcional
      tags:
      - Marcas
  /api/brands/{id}:
    delete:
      description: Preserva vínculos existentes e impede novos vínculos; marcas públicas
        não podem ser arquivadas
      operationId: archiveBrand
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Arquiva marca privada
      tags:
      - Marcas
    put:
      description: Solicitação pendente bloqueia edição; marca pública exige solicitação
        de correção
      operationId: updateBrand
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequestDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResponseDTO"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Edita marca privada da empresa
      tags:
      - Marcas
  /api/brands/{id}/requests:
    post:
      description: Snapshot imutável enquanto pendente; dados aprovados permanecem
        vigentes até a decisão
      operationId: submitBrand
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequestDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandRequestResponseDTO"
          description: Created
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Solicita publicação ou correção
      tags:
      - Marcas
  /api/business-contacts:
    get:
      operationId: findAllBusinessContact
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessContactResponseDTO"
          description: Listagem retornada com sucesso
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Lista o contato comercial da empresa atual
      tags:
      - Contatos Comerciais
  /api/business-contacts/{id}:
    get:
      operationId: findByIdBusinessContact
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessContactResponseDTO"
          description: Contato comercial encontrado
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Contato comercial não encontrado
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Busca um contato comercial pelo id
      tags:
      - Contatos Comerciais
  /api/cart:
    get:
      description: "Cria o carrinho vazio no primeiro acesso. Preços, taxa e total\
        \ são calculados na hora."
      operationId: getCart
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponseDTO"
          description: Carrinho do usuário
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Usuário não pode comprar
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Retorna o carrinho do usuário
      tags:
      - Carrinho
  /api/cart/items/{offerId}:
    delete:
      operationId: removeItemCart
      parameters:
      - in: path
        name: offerId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponseDTO"
          description: Carrinho atualizado
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro interno inesperado
      summary: Remove uma oferta do carrinho
      tags:
      - Carrinho
    put:
      description: Adiciona a oferta ou troca a quantidade. A quantidade não pode
        passar do estoque.
      operationId: putItemCart
      parameters:
      - in: path
        name: offerId
        required: true
        schema:
          type: string
          format: uuid
