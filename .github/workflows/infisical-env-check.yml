name: Infisical Env Check

on:
  pull_request:
    paths:
      - .env.example
      - infisical.yaml
  push:
    branches: [main]
    paths:
      - .env.example
      - infisical.yaml
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  check:
    permissions:
      contents: read
    uses: Solierrr/.github/.github/workflows/infisical-env-check.yml@main
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
