name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run tests with coverage
        run: ./mvnw org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report -B

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            target/classes
            target/site/jacoco/jacoco.xml
            target/surefire-reports/*.xml

  schema:
    name: schema (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solaria
          POSTGRES_PASSWORD: solaria
          POSTGRES_DB: coredb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solaria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Solierrr/database-console
          path: database-console

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the coredb schema from the database-console migrations
        env:
          DB_POSTGRES_HOST: 127.0.0.1
          DB_POSTGRES_PORT: "5432"
          DB_POSTGRES_USER: solaria
          DB_POSTGRES_PASSWORD: solaria
          DB_POSTGRES_CORE: coredb
          DB_POSTGRES_SSLMODE: disable
        run: |
          pip install psycopg2-binary python-dotenv
          python database-console/scripts/migrate.py --target core
          PGPASSWORD=solaria psql -h 127.0.0.1 -U solaria -d coredb -v ON_ERROR_STOP=1 -q -f database-console/db/core/seed.sql

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Validate the entities against the real schema
        run: >-
          ./mvnw test -B -Dtest=ProjectPostgresIntegrationTest
          -DargLine="-Dsolaria.postgres.url=jdbc:postgresql://127.0.0.1:5432/coredb -Dsolaria.postgres.user=solaria -Dsolaria.postgres.password=solaria"
