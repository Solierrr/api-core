spring.application.name=persistence

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_POSTGRES_HOST:localhost}:${DB_POSTGRES_PORT:5432}/${DB_POSTGRES_CORE:dbsolier}
spring.datasource.username=${DB_POSTGRES_USER:solier}
spring.datasource.password=${DB_POSTGRES_PASSWORD:solier}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POSTGRES_HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.data-source-properties.sslmode=${DB_POSTGRES_SSLMODE:disable}
spring.datasource.hikari.data-source-properties.channelBinding=disable


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

spring.data.redis.url=redis://${UPSTASH_CORE_USERNAME:default}:${UPSTASH_CORE_PASSWORD:}@${UPSTASH_CORE_HOST:localhost}:${UPSTASH_CORE_PORT:6379}

redis.namespace=core
redis.supplier-search.ttl-min=12m
redis.supplier-search.ttl-max=18m
redis.supplier-search.counter-ttl=1h
redis.supplier-search.popularity-threshold=3
redis.supplier-search.max-cacheable-page=2
redis.supplier-search.max-cacheable-size=50

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# URI de api-auth que publica a chave pública via JWKS
app.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
# claim de emissor do jwt do usuário
app.jwt.issuer=solaria-auth
# secret do token de serviço M2M, precisa ter >= 32 bytes
app.jwt.service.secret=${SERVICE_JWT_SECRET}
# segredo compartilhado, comparado com clientSecret em POST /internal/service-tokens -> define quem pode emitir um token novo
app.jwt.service.client-secret=${SERVICE_CLIENT_SECRET}
# Emissor próprio do token de serviço
app.jwt.service.issuer=${SERVICE_JWT_ISSUER:solaria-persistence-internal}
# TTL do token de access
app.jwt.service.access-ttl-ms=${SERVICE_JWT_ACCESS_TTL_MS:600000}
# TTL do token de refresh
app.jwt.service.refresh-ttl-ms=${SERVICE_JWT_REFRESH_TTL_MS:3600000}

