spring.application.name=persistence

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbsolier}
spring.datasource.username=${DB_USERNAME:solier}
spring.datasource.password=${DB_PASSWORD:solier}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}
spring.datasource.hikari.data-source-properties.channelBinding=disable


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

redis.namespace=core
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# URI de api-auth que publica a chave pública via JWKS
app.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
# claim de emissor do jwt do usuário
app.jwt.issuer=solaria-auth
# secret do token de serviço M2M, precisa ter >= 32 bytes
app.jwt.service.secret=${SERVICE_JWT_SECRET}
# segredo compartilhado, comparado com clientSecret em POST /internal/service-tokens -> define quem pode emitir um token novo
app.jwt.service.client-secret=${SERVICE_CLIENT_SECRET}
# Emissor próprio do token de serviço
app.jwt.service.issuer=${SERVICE_JWT_ISSUER:solaria-persistence-internal}
# TTL do token de access
app.jwt.service.access-ttl-ms=${SERVICE_JWT_ACCESS_TTL_MS:600000}
# TTL do token de refresh
app.jwt.service.refresh-ttl-ms=${SERVICE_JWT_REFRESH_TTL_MS:3600000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:solier}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

