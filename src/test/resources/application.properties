spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
app.jwt.issuer=solaria-auth

app.jwt.service.secret=test-service-jwt-secret-must-be-at-least-32-bytes-long
app.jwt.service.client-secret=test-service-client-secret-value
app.jwt.service.issuer=solaria-persistence-internal
app.jwt.service.access-ttl-ms=600000
app.jwt.service.refresh-ttl-ms=3600000
